name: Keep Supabase Alive

# Gratis-Supabase pauser etter 7 dager uten "tilstrekkelig aktivitet", og da
# dør hele appen (registrering + innlogging + data). Lette LESE-kall teller
# ikke lenger (bekreftet 2026-09), så denne jobben gjør en ekte SKRIV-
# operasjon hver 3. dag: den oppdaterer en tidsstempel-rad i public.keepalive.
#
# Bonus: den skriver også en liten fil tilbake til repoet på hver kjøring,
# slik at GitHub ikke slår av den planlagte jobben etter 60 dager.

on:
  schedule:
    # kl. 06:00 UTC ~hver 3. dag
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skriv til Supabase (ekte aktivitet holder databasen våken)
        run: |
          URL=$(grep -E '^EXPO_PUBLIC_SUPABASE_URL=' .env | tail -1 | cut -d= -f2- | tr -d '\r')
          KEY=$(grep -E '^EXPO_PUBLIC_SUPABASE_ANON_KEY=' .env | grep -v 'DIN_' | tail -1 | cut -d= -f2- | tr -d '\r')
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Skriver keepalive-tidsstempel ($NOW) til $URL"
          curl -sf -m 30 -X PATCH \
            "$URL/rest/v1/keepalive?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\":\"$NOW\"}" \
            -o /dev/null -w "Keepalive-skriv: HTTP %{http_code}\n"

      # Best-effort: holder repoet aktivt så GitHub ikke slår av jobben etter 60 dager.
      - name: Oppdater tidsstempel (holder repoet aktivt)
        continue-on-error: true
        run: |
          mkdir -p .github
          date -u +"Sist pinget: %Y-%m-%d %H:%M UTC" > .github/keepalive-last-run.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/keepalive-last-run.txt
          git commit -m "chore: keepalive ping [skip ci]" || echo "Ingen endring aa committe"
          git push || echo "Kunne ikke pushe tidsstempel - skrivingen gikk uansett"
